# Build macOS (.dmg) แบบยังไม่ sign — กดรันเองจากแท็บ Actions เท่านั้น
# build เสร็จแล้วแนบ .dmg เข้า GitHub Release ของเวอร์ชันใน package.json (v<version>) ที่ต้องมีอยู่แล้ว
# auto-update ของ Windows อ่านแค่ latest.yml → ไฟล์ .dmg ใน Release ไม่กระทบ
# config แยก: electron-builder-mac.json (ฝั่ง Windows ยังใช้ "build" ใน package.json ตามเดิม)
name: Build macOS (unsigned)

on:
  workflow_dispatch:
    inputs:
      attach_to_release:
        description: "แนบ .dmg เข้า GitHub Release v<version ใน package.json>"
        type: boolean
        default: true

# ค่าเริ่มต้นอ่านอย่างเดียว — job build รัน npm ci (สคริปต์ของ dependency) จึงไม่ควรถือสิทธิ์เขียน
permissions:
  contents: read

jobs:
  build-mac:
    runs-on: macos-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - run: npm ci

      # Mac ต้องใช้ไอคอน ≥512px — ขยายจาก electron/icon.ico (ใหญ่สุด 256px) ตอน build เท่านั้น
      - name: Make mac icon
        run: |
          python3 -m pip install --quiet --break-system-packages pillow
          mkdir -p build-mac
          python3 -c "from PIL import Image; im=Image.open('electron/icon.ico'); im.size=max(im.ico.sizes()); im.load(); im.convert('RGBA').resize((512,512), Image.LANCZOS).save('build-mac/icon.png')"

      - run: npx vite build

      # ไม่มีบัญชี Apple → identity null + afterPack (.github/mac/adhoc-sign.cjs) sign แบบ ad-hoc
      # Apple Silicon ต้องมีอย่างน้อยลายเซ็นแบบนี้ถึงจะเปิดได้
      - name: Build dmg (arm64 + x64)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac --arm64 --x64 --config electron-builder-mac.json --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: machine-vision-mac
          path: release-mac/*.dmg
          if-no-files-found: error
          retention-days: 30

  # แยก job เพื่อให้สิทธิ์เขียน Release อยู่เฉพาะตรงนี้ (ไม่รัน npm ci / โค้ดของ dependency)
  attach-to-release:
    needs: build-mac
    if: ${{ inputs.attach_to_release }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: machine-vision-mac
          path: dmg

      - name: Upload .dmg to Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.build-mac.outputs.version }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null; then
            echo "::error::ไม่พบ Release $TAG — ออก Release ของ Windows ก่อน (electron-builder --win --publish always) แล้วค่อยรัน workflow นี้"
            exit 1
          fi
          # --clobber: รันซ้ำได้ ไฟล์ชื่อเดิมถูกแทนที่
          gh release upload "$TAG" dmg/*.dmg --clobber --repo "$GITHUB_REPOSITORY"
